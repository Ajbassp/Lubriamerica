  <rect x="184" y="30" width="32" height="30" rx="7"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(30 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(60 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(90 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(120 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(150 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(180 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(210 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(240 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(270 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(300 200 212)"/>
  <rect x="184" y="30" width="32" height="30" rx="7" transform="rotate(330 200 212)"/>
  <circle cx="200" cy="212" r="140" fill="none" stroke="#000" stroke-width="38"/>
</svg>
