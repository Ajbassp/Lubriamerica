<!doctype html>
<meta charset="utf-8">
<title>Lubriamérica — plantilla carrusel</title>
<!--
  Plantilla base 1080x1350. Dos variantes:
    <body class="portada">   → numeral dentro del titular + remate en itálica
    <body class="interior">  → numeral en columna + bloque de desmentido
  Exportar con:  ./render.sh esta-pieza.html salida.png
-->
<style>
@font-face{font-family:Montserrat;src:url("fonts/Montserrat[wght].ttf")format("truetype-variations");font-weight:100 900;font-style:normal}
@font-face{font-family:Montserrat;src:url("fonts/Montserrat-Italic[wght].ttf")format("truetype-variations");font-weight:100 900;font-style:italic}

:root{
  --naranja:#ff7400;
  --naranja-oscuro:#c96410;
  --gris:#272726;
  --blanco:#f9f7f6;
  --rojo:#e01b1b;
  --margen:72px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{
  position:relative;background:var(--gris);color:var(--blanco);
  font-family:Montserrat,"Liberation Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ── Foto ─────────────────────────────────────────────────────────── */
.foto{position:absolute;inset:0 0 490px 0;overflow:hidden;background:#3a3a38}
.foto img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)brightness(.9)}

/* Marcador de posición mientras no haya foto real. Bórralo al montar la imagen. */
.foto.vacia::after{
  content:"FOTO 1080×860";position:absolute;inset:0;display:grid;place-items:center;
  font-size:34px;font-weight:700;letter-spacing:.12em;color:#ffffff26;
  background:repeating-linear-gradient(135deg,#00000000 0 28px,#ffffff0a 28px 56px),#4a4a47;
}

/* ── Scrim ────────────────────────────────────────────────────────── */
.scrim{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#27272600 28%,#2727268c 45%,#272726eb 58%,var(--gris) 65%);
}

/* ── Marca de agua: engranaje del logo ────────────────────────────── */
.marca{position:absolute;left:58%;bottom:-190px;width:700px;transform:translateX(-50%);opacity:.035}
.marca svg{display:block;width:100%;height:auto;fill:var(--blanco)}

/* ── Rayado diagonal ──────────────────────────────────────────────── */
.rayado{
  position:absolute;opacity:.08;pointer-events:none;
  background:repeating-linear-gradient(45deg,#f9f7f6 0 3px,#f9f7f600 3px 22px);
}
.rayado.sup{top:0;left:0;width:420px;height:420px;
  -webkit-mask-image:linear-gradient(155deg,#000 20%,#0000 75%)}
.rayado.med{top:700px;left:0;width:100%;height:260px;
  -webkit-mask-image:linear-gradient(180deg,#0000,#000 40%,#0000)}

/* ── Zona de texto ────────────────────────────────────────────────── */
.contenido{
  position:absolute;left:var(--margen);right:var(--margen);bottom:168px;
}

.titular{font-size:66px;font-weight:800;line-height:.98;letter-spacing:-.01em}

/* Variante interior: numeral en columna */
.interior .fila{display:flex;align-items:flex-start;gap:26px}
.interior .numeral{
  flex:0 0 auto;min-width:140px;
  font-size:268px;font-weight:900;line-height:.72;color:var(--naranja);
}

/* Variante portada: numeral dentro del titular */
.portada .numeral{
  font-size:210px;font-weight:900;line-height:.78;color:var(--naranja);
  float:left;margin:0 18px 0 0;
}
.portada .remate{
  clear:both;display:flex;align-items:center;gap:24px;margin-top:34px;
  font-size:62px;font-weight:800;font-style:italic;text-transform:uppercase;
}

/* ── Bloque del desmentido ────────────────────────────────────────── */
.desmentido{display:flex;align-items:center;gap:20px;margin-top:40px}
.badge{
  flex:0 0 auto;width:78px;height:78px;border-radius:50%;background:var(--rojo);
  display:grid;place-items:center;
}
.badge svg{width:34px;height:34px;stroke:var(--blanco);stroke-width:6;stroke-linecap:round}
.no{font-size:76px;font-weight:900;line-height:1}
.regla{flex:0 0 auto;width:5px;height:86px;background:var(--blanco);margin:0 4px}
.eyebrow{
  font-size:26px;font-weight:700;color:var(--naranja);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;
}
.cuerpo{font-size:27px;font-weight:600;line-height:1.35;max-width:640px}

/* ── Pie ──────────────────────────────────────────────────────────── */
.pie{
  position:absolute;left:0;right:0;bottom:60px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-size:34px;font-weight:700;
}
.pie svg{width:38px;height:38px;fill:none;stroke:var(--blanco);stroke-width:2.2}
</style>

<body class="interior">

  <div class="foto vacia"><!-- <img src="foto.jpg" alt=""> --></div>
  <div class="scrim"></div>

  <div class="marca">
    <!-- SUSTITUIR por el engranaje del logotipo real (assets/logo/marca.svg) -->
    <svg viewBox="0 0 400 400" aria-hidden="true">
      <g>
        <rect x="186" y="24" width="28" height="52" rx="5"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(30 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(60 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(90 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(120 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(150 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(180 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(210 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(240 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(270 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(300 200 200)"/>
        <rect x="186" y="24" width="28" height="52" rx="5" transform="rotate(330 200 200)"/>
      </g>
      <circle cx="200" cy="200" r="130" fill="none" stroke="#f9f7f6" stroke-width="52"/>
    </svg>
  </div>

  <div class="rayado sup"></div>
  <div class="rayado med"></div>

  <div class="contenido">
    <div class="fila">
      <div class="numeral">1</div>
      <h1 class="titular">Mientras más espeso<br>el aceite, mejor es la<br>lubricación del motor</h1>
    </div>

    <div class="desmentido">
      <div class="badge"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></div>
      <div class="no">NO</div>
      <div class="regla"></div>
      <div>
        <!-- <div class="eyebrow">Pero ojo con un dato</div> -->
        <p class="cuerpo">Si le echas un aceite más grueso, al estar en frío no circula como debe y ahí es cuando el motor se desgasta más rápido.</p>
      </div>
    </div>
  </div>

  <div class="pie">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="17.6" cy="6.4" r="1.1" fill="#f9f7f6" stroke="none"/></svg>
    <span>@lubriamericapf</span>
  </div>

</body>
